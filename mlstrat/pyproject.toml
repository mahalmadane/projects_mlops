[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "mlstrat"
version = "0.1.0"
description = "ML project scaffolding plus strategy-based tools for exploratory analysis, cleaning and model training on tabular data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Toure" }]
requires-python = ">=3.10"
keywords = ["eda", "data-cleaning", "outliers", "missing-values", "scikit-learn", "pandas", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "scipy>=1.9",
    "matplotlib>=3.6",
    "seaborn>=0.12",
]

[project.scripts]
mlstrat = "mlstrat.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[project.urls]
Homepage = "https://github.com/mahalmadane/projects_mlops/tree/main/mlstrat"
Issues = "https://github.com/mahalmadane/projects_mlops/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mlstrat"]

[tool.hatch.build.targets.sdist]
include = ["src/mlstrat", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
