name: mlstrat

# Tests on every change to the library; publication to PyPI when a tag
# like "mlstrat-v0.1.0" is pushed.
on:
  push:
    branches: [main]
    paths: ["mlstrat/**", ".github/workflows/mlstrat.yml"]
    tags: ["mlstrat-v*"]
  pull_request:
    paths: ["mlstrat/**", ".github/workflows/mlstrat.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: mlstrat

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env:
          MPLBACKEND: Agg

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Check the tag matches the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/mlstrat-v')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME#mlstrat-v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: mlstrat/dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/mlstrat-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing: no token stored in GitHub
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
